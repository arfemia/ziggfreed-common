apply from: "$rootDir/gradle/zc-module.gradle"

// The consumer-agnostic PROGRESSION engines and the shared cores under them. `progress/` holds what
// every lifecycle engine here shares (the registered objective vocabulary, the two match flavors,
// the progress + objective model, the dispatch knobs); `quest/` holds the quest lifecycle built on
// top (catalogue, status, gates, persistence seam, asset layer, outbound events). It carries no
// content and no domain vocabulary of its own, so it needs nothing beyond the shared registry +
// logging primitives in zc-core.
//
// REVERSE-EDGE TRAP: this module sits below zc-dialogue, so it may never import dialogue,
// presentation, or world. A turn-in conversation, a results page, or a waypoint is a SEAM the
// wiring root or the consumer fills, never an import. See the quest package router.
//
// The zc-loot edge is the reward VOCABULARY (`loot.reward`): what a reward is, who pays it out, and
// the isolated payout pass are shared with every other engine that grants, so they live one module
// down rather than being re-derived here. The edge only ever points this way.

dependencies {
    implementation project(':zc-core')
    implementation project(':zc-loot')
}

// Regenerate this module's SCHEMA.md - the authoring reference for the quest and achievement asset
// types - from the actual codecs. The classpath needs the compiled classes PLUS every compile-time
// dependency (compileClasspath, not runtimeClasspath): the writer loads QuestAsset / AchievementAsset
// and therefore transitively the Hytale server jar's codec classes, which are compileOnly and never
// bundled. Run ON DEMAND (`gradlew :zc-progression:generateSchemaDocs`); the output is committed and
// deliberately NOT wired into processResources or build, because SCHEMA.md is repo documentation
// rather than a jar resource. SchemaDocDriftTest fails the build when the committed file is stale.
def schemaDocOutput = file('SCHEMA.md')
tasks.register('generateSchemaDocs', JavaExec) {
    dependsOn 'compileJava'
    group = 'documentation'
    description = 'Regenerate this module\'s SCHEMA.md quest + achievement authoring reference from the asset codecs'
    classpath = sourceSets.main.output.classesDirs + configurations.compileClasspath
    mainClass = 'com.ziggfreed.common.progress.docs.SchemaDocWriter'
    args schemaDocOutput.absolutePath
    inputs.files(fileTree('src/main/java/com/ziggfreed/common/quest/asset') { include '**/*.java' })
    inputs.files(fileTree('src/main/java/com/ziggfreed/common/achievement/asset') { include '**/*.java' })
    inputs.files(fileTree('src/main/java/com/ziggfreed/common/progress/asset') { include '**/*.java' })
    inputs.files(fileTree('src/main/java/com/ziggfreed/common/progress/gate') { include '**/*.java' })
    inputs.file('src/main/java/com/ziggfreed/common/progress/docs/SchemaDocWriter.java')
    outputs.file(schemaDocOutput)
}
