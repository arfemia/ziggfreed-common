rootProject.name = 'ZiggfreedCommon'

// The library is built as seventeen focused modules plus a thin wiring root. Every module keeps the
// SAME package root (com.ziggfreed.common.*) and they are all merged back into the single
// ZiggfreedCommon jar a server loads, so a module boundary here is a build-time concern only: no
// consumer import, class name, or manifest changes because of it.
//
// Only ONE jar is ever installed. The per-module jars in zc-*/build/libs are compile inputs to
// that aggregate; they carry no manifest.json and are not loadable mods on their own (the shipped
// .ui pack has cross-module references, e.g. a dialogue page importing the shared frames).
include 'zc-core'
include 'zc-presentation'
include 'zc-cast'
include 'zc-entity'
include 'zc-effects'
include 'zc-loot'
include 'zc-dialogue'
include 'zc-progression'
include 'zc-objectives'
include 'zc-instance'
include 'zc-world'
include 'zc-scaling'
include 'zc-commerce'
include 'zc-encounter'
include 'zc-calendar'
include 'zc-almanac'
include 'zc-reputation'

// The local build cache, shared by every family repo and every tree on this machine: the main
// checkout's .gradle-build-cache, on the workspace's drive, never Gradle's default under the user
// home. The workspace root is workspaceRoot (gradle.properties) from this folder; a tree is a
// linked worktree of the workspace (its .git is a file), and git's commondir leads from it back to
// the main checkout, so every tree shares the one cache. A repo built outside a workspace (no
// family.properties at workspaceRoot) keeps its own .gradle-build-cache beside this file
// (git-ignored), still never the default under the user home.
def familyBuildCache = {
    def rel = providers.gradleProperty('workspaceRoot').getOrNull()
    File root = rel ? new File(settingsDir, rel).canonicalFile : null
    if (root == null || !new File(root, 'family.properties').isFile()) {
        return new File(settingsDir, '.gradle-build-cache')
    }
    File dotGit = new File(root, '.git')
    def gitdir = dotGit.isFile() ? (dotGit.getText('UTF-8') =~ '(?m)^gitdir:\\s*(.+?)\\s*$') : null
    if (gitdir != null && gitdir.find()) {
        File treeGitDir = new File(gitdir.group(1))
        if (!treeGitDir.absolute) {
            treeGitDir = new File(root, gitdir.group(1))
        }
        File commondir = new File(treeGitDir, 'commondir')
        if (commondir.isFile()) {
            File common = new File(treeGitDir, commondir.getText('UTF-8').trim()).canonicalFile
            if (common.name == '.git' && common.isDirectory()) {
                root = common.parentFile
            }
        }
    }
    new File(root, '.gradle-build-cache')
}()
buildCache {
    local {
        directory = familyBuildCache
    }
}
