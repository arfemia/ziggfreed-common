group=ziggfreed
name=ZiggfreedCommon
version=2.2.0
java_version=25
mod_description=Ziggfreed Common - shared, mod-agnostic Hytale primitives (3D sound, camera, asset-index cache, command exec, notifications, HUD helpers, a branching NPC dialogue engine) used by standalone Ziggfreed minigames.
website=https://mmo-skill-tree-docs.ziggfreed.com
game_build=latest
entry_point=com.ziggfreed.common.ZiggfreedCommonPlugin

# Compile against the SAME jar the server runs (D:/Games/Hytale, the live 0.5.5
# build) - the old AppData jar (0.5.3, Jan) drifts and causes runtime
# NoSuchMethodError (e.g. Universe.getPlayers signature change). In a workspace, its
# family.properties' hytaleHome, patchline and game_build replace these (see build.gradle);
# these values serve a build of this repo alone.
hytaleHome=D:/Games/Hytale/install
patchline=release

# The workspace root, relative to this project dir: the folder whose family.properties maps every
# family repo and pack to its path. This build reads no sibling; the family's consumers resolve
# this repo through that map.
workspaceRoot=../..

# Gradle itself, the same in every family repo so one daemon serves them all (a different value
# here starts a second daemon): projects build in parallel, task outputs go to the build cache
# (its folder is set in settings.gradle), a run whose build scripts and the files they read are
# unchanged reuses the configuration cache instead of configuring again, and an idle daemon exits
# after 30 minutes.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=1800000
