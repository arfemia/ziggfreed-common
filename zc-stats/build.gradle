apply from: "$rootDir/gradle/zc-module.gradle"

// The player stat store: every player's lifetime tallies in one saved record (ZiggfreedCommon:Stats),
// fed by the library's own producers on any server and by whatever a consumer adds through PlayerStats,
// and the library's default ziggfreedcommon:counter source. The package is playerstats, never stats:
// zc-core and zc-entity already split that one (zc-entity's stats/CLAUDE.md).
//
// Nothing in the library depends on this module: a consumer reaches it through PlayerStats.

dependencies {
    // SafeLog, the counter bag and its packed save string, the counter factor seam and its source, the
    // keyed asset base and owner-file reader, the editor schema, i18n, validation findings, the
    // target-player command walk.
    implementation project(':zc-core')
    // The shared moment stream the store counts from (MomentListener, ProgressionRuntime), and the
    // objective leaf a stat's From entry is written in (ObjectiveLeafAsset, ObjectiveDef).
    implementation project(':zc-progression')
    // The stat board the store ranks into (StatBoard, StatBoardSource, StatSectionConfig) and the column
    // shape it asks for (StatColumnDef, ColumnFormat). One-way: zc-instance never sees this module, so the
    // store fills the board's source seam at setup.
    implementation project(':zc-instance')
    // The boss framework's defeat event and its binding rows: the store counts a defeat into its encounter
    // stats, keyed by the bucket the binding row names. It only listens and reads; one-way, since
    // zc-encounter never imports this module (EncounterEdgeTest).
    implementation project(':zc-encounter')
}
