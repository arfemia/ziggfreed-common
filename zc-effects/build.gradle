apply from: "$rootDir/gradle/zc-module.gradle"

// Native effect application. Carries com.ziggfreed.common.effect (apply/remove/track a native
// EntityEffect by id) and com.ziggfreed.common.instance.effect (the timed + banded encounter
// framework), both self-contained and wanted by consumers that never touch the rest of the
// instance-experience layer, so they live here rather than dragging zc-instance along.
//
// This module must NEVER gain an edge to zc-loot: a loot grant that applies a native effect
// dispatches through a registered reward kind the wiring root populates, which is what keeps the
// two directions from closing into a cycle.

dependencies {
    implementation project(':zc-core')
    // The custom interaction-Type toolkit, for the ZigCostume Type (effect/costume) and the crowd-control Types
    // (effect/control). One-way: zc-cast depends on zc-core alone and never reaches back.
    implementation project(':zc-cast')
    // The per-type resistance stats (effect/resist reads DamageResist_<Type> and its ceiling off the
    // entity, through stats/damage/DamageResistances and StatIndexCache) and the per-type damage bonus
    // sources (effect/outgoing sums them through stats/damage/TypedDamageBonuses). One-way: zc-entity depends on
    // zc-core alone and never sees the native-effect primitive (its gear-set seam stays root-filled).
    implementation project(':zc-entity')
    // The engine asset-store swap the effect-controller tests seed effects with.
    testImplementation(testFixtures(project(':zc-core')))
}
