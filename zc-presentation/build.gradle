apply from: "$rootDir/gradle/zc-module.gradle"

// Everything a player sees or hears: UI primitives (retint, theme, toast, HUD, forms, rows),
// 3D sound, camera effects, and the notification wrappers.
//
// The zc-loot edge exists for the reward-chip reading and nothing else: RewardToastLines, the bridge
// from chips to toast body rows, and the kit's DetailLine.reward, a chip as a detail line. It points
// DOWN the graph (zc-loot depends on zc-core only and must never grow an edge back up to a module
// that presents things), so it can never cycle.

dependencies {
    implementation project(':zc-core')
    implementation project(':zc-loot')
}

// UiDocumentSyntaxTest reads every zc module's Custom UI documents as one merged tree (the way the client loads
// them), so those documents are inputs of this module's tests: an edit to any module's .ui reruns it instead of
// letting a stale green pass a document that would disconnect every client at load.
tasks.withType(Test).configureEach {
    inputs.files(fileTree(rootDir) { include 'zc-*/src/main/resources/Common/UI/Custom/**/*.ui' })
            .withPropertyName('zcUiDocuments')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
