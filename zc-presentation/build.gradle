apply from: "$rootDir/gradle/zc-module.gradle"

// Everything a player sees or hears: UI primitives (retint, theme, toast, HUD, forms, rows),
// 3D sound, camera effects, the notification wrappers, and the authoring kit (authoring/: the
// creative authoring tools and the wizard frame every in-game editor opens in).
//
// The zc-loot edge exists for two things and nothing else: the reward-chip reading (RewardToastLines,
// the bridge from chips to toast body rows, and the kit's DetailLine.reward, a chip as a detail line),
// and the game's own pickup notice (PickupMimic.notifyLikeNativePickup goes through
// GroundSpillSinks.noticeLikePickup, its one caller, which a loot hand-over lands through). It points
// DOWN the graph (zc-loot depends on zc-core only and must never grow an edge back up to a module
// that presents things), so it can never cycle.

dependencies {
    implementation project(':zc-core')
    implementation project(':zc-loot')
    // Two things: ModelParticleService (the item-cost confirm page, ui/confirm, plays its caller's sparkle where
    // the player stands when they confirm, through the one guarded particle seam) and the custom interaction-Type
    // toolkit (interaction/type: the authoring kit's ZigAuthoringTool Type reads its click through InteractionCtx
    // and resolves through InteractionOutcome). One-way: zc-cast depends on zc-core alone and never imports this
    // module.
    implementation project(':zc-cast')
}

// UiDocumentSyntaxTest reads every zc module's Custom UI documents as one merged tree (the way the client loads
// them), so those documents are inputs of this module's tests: an edit to any module's .ui reruns it instead of
// letting a stale green pass a document that would disconnect every client at load. An empty folder
// there is no document, so it counts for nothing.
tasks.withType(Test).configureEach {
    inputs.files(fileTree(rootDir) { include 'zc-*/src/main/resources/Common/UI/Custom/**/*.ui' })
            .withPropertyName('zcUiDocuments')
            .withPathSensitivity(PathSensitivity.RELATIVE)
            .ignoreEmptyDirectories()
}
