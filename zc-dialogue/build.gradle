apply from: "$rootDir/gradle/zc-module.gradle"

// The branching NPC dialogue engine and the NPC spawn/placement engine. It sits high in the graph
// because a placement gate resolves world identity (zc-world) and the dialogue page paints through
// the shared UI primitives (zc-presentation).
//
// One PUBLIC signature here re-exports a zc-world type: DialogueCondition.World#getSelector
// returns a world.WorldSelector. The edge stays `implementation` because nothing depends on this
// module yet; a future module that depends on zc-dialogue AND calls getSelector must declare its
// own zc-world edge, or this one becomes `api`. So do `npc/placement/runtime/PlacementWorlds.wheresOf`
// (a `world.WorldSelector` list) and `positionsOf` (`worldmap.WaypointPosition`); zc-objectives,
// their one caller, declares its own zc-world edge.

// The quest-aware conversation vocabulary (QuestState / ReadyToTurnIn / Accept / TurnIn) reads
// through zc-progression's NARROW QuestStateReader seam and nothing else - never QuestEngine, which
// mutates: a condition that could reach it could accept a quest while merely rendering a line. The
// edge is one-way and must stay so; zc-progression may never import anything from here.

dependencies {
    implementation project(':zc-core')
    implementation project(':zc-presentation')
    implementation project(':zc-world')
    implementation project(':zc-progression')
    // ItemPropEntityService: a placement's Props are drawn as the library's still, intangible item props.
    // zc-entity rests on zc-core alone (zc-world already depends on it), so the edge is one-way.
    implementation project(':zc-entity')
}
