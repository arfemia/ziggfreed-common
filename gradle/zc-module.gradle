// Shared build convention for every zc-* module. A module's own build.gradle is this one line plus
// its `implementation project(':zc-x')` edges, so there is exactly one place to change a compiler
// flag, a toolchain, or the server-jar path.
//
// Inter-module edges are `implementation`, never `api`: an `api` edge puts its own dependencies on
// every downstream module's compile classpath, which is precisely the isolation the module split
// exists to buy. The one deliberate `api` in the tree is jsr305, below, and it is `api` because a
// consumer compiling against the aggregate jar has to be able to resolve the annotations.

apply plugin: 'java-library'

group = rootProject.group
version = rootProject.version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    // A sources jar per module, because the root aggregates them into the one published
    // -sources artifact. NO javadoc jar: the published javadoc is built once at the root over
    // the whole aggregated tree, which is also the only place a cross-module {@link} resolves
    // (a module deliberately cannot see a class it does not depend on). A per-module javadoc jar
    // would be a dead artifact that only reported those links as unresolvable.
    withSourcesJar()
}

// zc-core -> ziggfreed-common-core-<version>.jar. Deliberately NOT "ZiggfreedCommon-*": build.ps1
// and the root rebuild script pin the installable runtime jar by that exact prefix, and a module
// jar must never be mistaken for it.
base.archivesName = project.name.replace('zc-', 'ziggfreed-common-')

repositories {
    mavenCentral()
}

// Compile against the SAME jar the server runs (path in gradle.properties).
def hytaleServerJar = new File("${hytaleHome}/${patchline}/package/game/${game_build}/Server/HytaleServer.jar")

dependencies {
    // jsr305 for @Nonnull/@Nullable. `api` so it reaches a module that depends on this one, and
    // so consumers compiling against the aggregate jar can resolve the annotations. It is NOT
    // bundled into the aggregate (the root's moduleBundle configuration is non-transitive), which
    // is what keeps stray javax/annotation entries out of the shipped jar.
    api 'com.google.code.findbugs:jsr305:3.0.2'

    // The Hytale server jar is provided at runtime (the server loads it first), so we NEVER bundle
    // it - bundling would double-load engine classes under two classloaders.
    compileOnly(files(hytaleServerJar))

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 requires the JUnit Platform launcher on the test runtime classpath.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Tests compile + run the pure engine paths (codec decode, sugar, template resolve), which
    // need the server jar's shaded Gson + codec classes on the TEST classpath too.
    testImplementation(files(hytaleServerJar))
}

// A module that ships test fixtures compiles them against the same server jar its tests run on.
pluginManager.withPlugin('java-test-fixtures') {
    dependencies {
        testFixturesApi 'com.google.code.findbugs:jsr305:3.0.2'
        testFixturesCompileOnly(files(hytaleServerJar))
    }
}

// Never call a deprecated engine API (family-wide rule, hyMMO's
// .claude/rules/java-conventions.md): -Xlint:removal surfaces every Hytale API annotated @Deprecated(forRemoval = true)
// still in use, and -Werror promotes that warning to a hard compile failure. A future Hytale
// server update that deprecates-for-removal an API this mod calls fails the build on sight.
// compileJava only (not compileTestJava), matching the hyMMO jar's own scoping. A plain
// @Deprecated call compiles green here: the deprecation gate applied below (see the root
// build.gradle) fails `check` on any such call, in any source set, not marked
// "// DEPRECATION-KEPT: <why>".
compileJava {
    options.compilerArgs << '-Xlint:removal' << '-Werror'
}

apply from: "$rootDir/gradle/deprecation-gate.gradle"

// Not wired into `build` (see the java block above); configured so an explicit
// `gradlew :zc-x:javadoc` behaves like the root's run.
javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

// Two test JVMs, split by a JUnit 5 tag on the test class or method.
//
// `test` is the log-manager-less unit JVM every consumer mod's own tests run in (RPG Stations, the
// MMO), with no java.util.logging.manager set, exactly as in 2.1.x. It is the only place the
// library's logging guards (SafeLog, GuardedLogger, every "log-manager-less unit JVM" catch) are
// actually exercised, so every untagged test runs here and nowhere else.
//
// `engineItemTest` runs ONLY the tests tagged `engine-items`: the ones that build a real engine
// Item, ItemStack, ItemQuality or a seeded engine asset store. It starts the JVM under the engine's
// own log manager, installed before anything touches java.util.logging. HytaleLogger's static init
// refuses to run under any other manager, and the engine's item classes reach it through their
// codecs' validators, so without it a test cannot build a real ItemStack or Item at all: whichever
// code touches JUL first (the JUnit launcher does) installs the JDK default and every later engine
// class init fails. A live server installs this same manager at boot.
//
// An engine-item test left untagged dies in `test` on the engine's class-init error. The reverse is
// not automatic: a guard test tagged into `engineItemTest` would pass without proving its guard, so
// never tag one. SafeLogTest carries an explicit check (it asserts it runs with no engine log manager
// installed); other guard tests rely on staying untagged. `check`
// (so `gradlew build`) runs both. A module whose test sources never name the tag (@Tag("engine-items"),
// quotes included) skips engineItemTest instead of starting an empty JVM, so a module gains the
// task's run with its first tagged test and needs no build change; an engineItemTest that runs and
// still discovers nothing does not fail.
def engineItemsTag = 'engine-items'
def exportProperties = System.properties.findAll { it.key.toString().startsWith('export') }

// Every test JVM in the module: a 512 MB heap, the serial collector and C1-only compilation, which
// start fastest for a JVM that lives seconds, never long enough for C2 or a parallel GC to pay off.
tasks.withType(Test).configureEach {
    maxHeapSize = '512m'
    jvmArgs '-XX:+UseSerialGC', '-XX:TieredStopAtLevel=1'
    // Never from the build cache: a test can read an input no task declares, and a -D generator run
    // writes files that are no task's output, so only a real run proves it. UP-TO-DATE still skips
    // a test task whose declared inputs are unchanged.
    outputs.cacheIf('tests read undeclared inputs') { false }
}

test {
    useJUnitPlatform {
        excludeTags engineItemsTag
    }
    // Forward gradlew-level -Dexport* system properties into the test JVM, so a one-shot gated
    // generator (a golden-fixture capture, say) can be triggered from the command line without
    // anybody editing a build file to do it.
    systemProperties exportProperties
}

def engineItemTest = tasks.register('engineItemTest', Test) {
    description = 'Runs the tests tagged engine-items, which build real engine items, under HytaleLogManager.'
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags engineItemsTag
    }
    failOnNoDiscoveredTests = false
    systemProperties exportProperties
    systemProperty 'java.util.logging.manager', 'com.hypixel.hytale.logger.backend.HytaleLogManager'
    shouldRunAfter test
    def testSources = sourceSets.test.java
    def tagLiteral = '"' + engineItemsTag + '"'
    onlyIf('a test source names the engine-items tag') {
        testSources.files.any { it.name.endsWith('.java') && it.getText('UTF-8').contains(tagLiteral) }
    }
}

tasks.named('check') {
    dependsOn engineItemTest
}
