// Shared build convention for every zc-* module. A module's own build.gradle is this one line plus
// its `implementation project(':zc-x')` edges, so there is exactly one place to change a compiler
// flag, a toolchain, or the server-jar path.
//
// Inter-module edges are `implementation`, never `api`: an `api` edge puts its own dependencies on
// every downstream module's compile classpath, which is precisely the isolation the module split
// exists to buy. The one deliberate `api` in the tree is jsr305, below, and it is `api` because a
// consumer compiling against the aggregate jar has to be able to resolve the annotations.

apply plugin: 'java-library'

group = rootProject.group
version = rootProject.version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    // A sources jar per module, because the root aggregates them into the one published
    // -sources artifact. NO javadoc jar: the published javadoc is built once at the root over
    // the whole aggregated tree, which is also the only place a cross-module {@link} resolves
    // (a module deliberately cannot see a class it does not depend on). A per-module javadoc jar
    // would be a dead artifact that only reported those links as unresolvable.
    withSourcesJar()
}

// zc-core -> ziggfreed-common-core-<version>.jar. Deliberately NOT "ZiggfreedCommon-*": build.ps1
// and the root rebuild script pin the installable runtime jar by that exact prefix, and a module
// jar must never be mistaken for it.
base.archivesName = project.name.replace('zc-', 'ziggfreed-common-')

repositories {
    mavenCentral()
}

// Compile against the SAME jar the server runs (path in gradle.properties).
def hytaleServerJar = new File("${hytaleHome}/${patchline}/package/game/${game_build}/Server/HytaleServer.jar")

dependencies {
    // jsr305 for @Nonnull/@Nullable. `api` so it reaches a module that depends on this one, and
    // so consumers compiling against the aggregate jar can resolve the annotations. It is NOT
    // bundled into the aggregate (the root's moduleBundle configuration is non-transitive), which
    // is what keeps stray javax/annotation entries out of the shipped jar.
    api 'com.google.code.findbugs:jsr305:3.0.2'

    // The Hytale server jar is provided at runtime (the server loads it first), so we NEVER bundle
    // it - bundling would double-load engine classes under two classloaders.
    compileOnly(files(hytaleServerJar))

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 requires the JUnit Platform launcher on the test runtime classpath.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Tests compile + run the pure engine paths (codec decode, sugar, template resolve), which
    // need the server jar's shaded Gson + codec classes on the TEST classpath too.
    testImplementation(files(hytaleServerJar))
}

// Never call a deprecated engine API (repo-wide sibling-mod edict, additional-mods/CLAUDE.md,
// 2026-07-22): -Xlint:removal surfaces every Hytale API annotated @Deprecated(forRemoval = true)
// still in use, and -Werror promotes that warning to a hard compile failure. A future Hytale
// server update that deprecates-for-removal an API this mod calls fails the build on sight.
// compileJava only (not compileTestJava), matching the hyMMO jar's own scoping.
compileJava {
    options.compilerArgs << '-Xlint:removal' << '-Werror'
}

// Not wired into `build` (see the java block above); configured so an explicit
// `gradlew :zc-x:javadoc` behaves like the root's run.
javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

test {
    useJUnitPlatform()
}
