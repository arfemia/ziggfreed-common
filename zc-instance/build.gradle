apply from: "$rootDir/gradle/zc-module.gradle"

// The instance-experience layer: arena, match rules, play/queue and results screens, presets,
// leaderboards, plus the lobby and party systems that feed them.

dependencies {
    implementation project(':zc-core')
    implementation project(':zc-presentation')
    implementation project(':zc-loot')
    // The boss framework's folded binding rows: the bucket a row names keys a fight's records, and
    // EncounterBoards, Records' Boss Fights and /zigleaderboard read the rows to name and find them. It
    // only reads; nothing here reaches into a fight, and the presets stay boss-unaware. One-way:
    // zc-encounter never imports this module (EncounterEdgeTest fails its build if it tries).
    implementation project(':zc-encounter')
}
